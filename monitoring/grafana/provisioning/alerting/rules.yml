apiVersion: 1

groups:
  - orgId: 1
    name: security
    folder: RoleGate
    interval: 1m
    rules:
      # ---------------------------------------------------------------
      - uid: failed-login-spike
        title: Failed login spike
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({service="backend"} |~ "POST /api/auth/login.* 401" [5m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: '__expr__'
            model:
              datasource:
                type: __expr__
                uid: '__expr__'
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: '__expr__'
            model:
              datasource:
                type: __expr__
                uid: '__expr__'
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Many failed logins
          description: '{{ $values.B.Value }} failed login attempts (HTTP 401) in the last 5 minutes. Check the Audit Log page for the accounts and IPs involved.'
        labels:
          severity: warning

      # ---------------------------------------------------------------
      - uid: login-throttling
        title: Login throttling triggered
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({service="backend"} |~ "POST /api/auth/login.* 429" [5m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: '__expr__'
            model:
              datasource:
                type: __expr__
                uid: '__expr__'
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: '__expr__'
            model:
              datasource:
                type: __expr__
                uid: '__expr__'
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Login requests are being throttled
          description: '{{ $values.B.Value }} login requests were rejected with HTTP 429 in the last 5 minutes (IP rate limit or account lockout). Possible brute-force attempt.'
        labels:
          severity: critical